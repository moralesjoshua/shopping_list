{% extends "base_shopping.html" %}

{% block title %}Edit {{ item.name }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-4">Edit "{{ item.name }}"</h2>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a class="btn btn-secondary ms-2" href="{% url 'list_items' %}">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
