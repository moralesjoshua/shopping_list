{% extends "base_shopping.html" %}

{% block title %}Add Item{% endblock %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-4">Add New Shopping Item</h2>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">Save Item</button>
                <a href="{% url 'list_items' %}" class="btn btn-primary ms-2">View Items</a>
            </form>

        </div>
    </div>
</div>


{% endblock %}
